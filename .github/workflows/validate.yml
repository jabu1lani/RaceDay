name: RaceDay API CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore RaceDay/RaceDay.slnx

    - name: Build solution
      run: dotnet build RaceDay/RaceDay.slnx --no-restore --configuration Release

    - name: Run tests
      run: dotnet test RaceDay/RaceDay.slnx --no-build --configuration Release --verbosity normal

    - name: Build success
      run: echo "✅ Build and tests passed successfully!" 