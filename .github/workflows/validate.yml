name: RaceDay API CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Find solution file
      run: |
        echo "=== Repository root ==="
        ls -la
        echo ""
        echo "=== All .sln files found ==="
        find . -name "*.sln" -type f

    - name: Restore dependencies
      run: dotnet restore RaceDay/RaceDay.sln

    - name: Build solution
      run: dotnet build RaceDay/RaceDay.sln --no-restore --configuration Release

    - name: Run tests
      run: dotnet test RaceDay/RaceDay.sln --no-build --configuration Release --verbosity normal

    - name: Build success
      run: echo "✅ Build and tests passed successfully!"