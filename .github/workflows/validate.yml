name: RaceDay API CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Find solution file
      run: |
        echo "=== Repository contents ==="
        ls -la
        echo ""
        echo "=== All .sln files found ==="
        find . -name "*.sln" -type f

    - name: Restore dependencies
      run: |
        SLN_FILE=$(find . -name "*.sln" -type f | head -n 1)
        if [ -z "$SLN_FILE" ]; then
          echo "❌ No solution file found!"
          exit 1
        fi
        echo "✅ Found solution: $SLN_FILE"
        dotnet restore "$SLN_FILE"

    - name: Build solution
      run: |
        SLN_FILE=$(find . -name "*.sln" -type f | head -n 1)
        dotnet build "$SLN_FILE" --no-restore --configuration Release

    - name: Run tests
      run: |
        SLN_FILE=$(find . -name "*.sln" -type f | head -n 1)
        dotnet test "$SLN_FILE" --no-build --configuration Release --verbosity normal

    - name: Build success
      run: echo "✅ Build and tests passed successfully!" 